services:
  
  db:
    image: postgres:16-alpine
    container_name: market-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:  ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - market-network

  
  api-gateway:
    build: ./api-gateway
    container_name: market-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - users-service
      - market-service
      - notifications-service
    networks:
      - market-network

  
  users-service:
    build: ./users-service
    container_name: market-users-service
    ports:
      - "8081:8081"
    depends_on:
       db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=users_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    
    networks:
      - market-network

  
  market-service:
    build: ./market-service
    container_name: market-market-service
    ports:
      - "8082:8082"
    depends_on:
       db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - market-network

  
  notifications-service:
    build: ./notifications-service
    container_name: market-notifications-service
    ports:
      - "8083:8083"
    networks:
      - market-network
  frontend:
    build: ./frontend
    container_name: market-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - market-network

    volumes:
      db_data:

networks:
  market-network:
    driver: bridge
